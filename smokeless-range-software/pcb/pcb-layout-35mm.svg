<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" font-family="monospace" font-size="11">
  <style>
    .board { fill: #1a5e1a; stroke: #000; stroke-width: 2; }
    .pad   { fill: #c9a227; stroke: #000; stroke-width: 0.5; }
    .silk  { fill: #fff; font-weight: bold; }
    .silk-line { stroke: #fff; stroke-width: 1.5; fill: none; }
    .trace { stroke: #c9a227; stroke-width: 3; fill: none; opacity: 0.7; }
    .gnd-trace { stroke: #888; stroke-width: 3; fill: none; opacity: 0.7; }
    .note  { fill: #000; font-size: 11px; }
    .dim   { stroke: #c00; stroke-width: 1; fill: none; }
    .dim-lbl { fill: #c00; font-size: 12px; font-weight: bold; }
    .title { font-size: 16px; font-weight: bold; fill: #000; }
  </style>

  <text x="300" y="25" text-anchor="middle" class="title">PCB Layout — 35mm Round — Top View</text>
  <text x="300" y="45" text-anchor="middle" class="note">Scale: ~12× actual size. PCB house places vias/traces; this is component placement guide.</text>

  <!-- Round board outline 35mm = 420px @12x scale -->
  <circle cx="300" cy="320" r="210" class="board"/>

  <!-- Mounting hole top (optional) -->
  <circle cx="300" cy="135" r="12" fill="#000"/>
  <circle cx="300" cy="135" r="6" fill="#fff"/>
  <text x="300" y="125" text-anchor="middle" class="silk" font-size="9">M2</text>

  <!-- ATtiny85 DIP-8 socket in center -->
  <rect x="240" y="270" width="120" height="60" fill="#222" stroke="#fff" stroke-width="1"/>
  <text x="300" y="295" text-anchor="middle" class="silk">ATtiny85</text>
  <text x="300" y="310" text-anchor="middle" class="silk" font-size="9">U1 (DIP-8 socket)</text>
  <!-- pin 1 marker -->
  <circle cx="252" cy="282" r="3" fill="#fff"/>

  <!-- pin pads (8 pads, 2 rows) -->
  <g>
    <circle cx="252" cy="282" r="4" class="pad"/>
    <circle cx="252" cy="297" r="4" class="pad"/>
    <circle cx="252" cy="312" r="4" class="pad"/>
    <circle cx="252" cy="327" r="4" class="pad"/>
    <circle cx="348" cy="327" r="4" class="pad"/>
    <circle cx="348" cy="312" r="4" class="pad"/>
    <circle cx="348" cy="297" r="4" class="pad"/>
    <circle cx="348" cy="282" r="4" class="pad"/>
  </g>

  <!-- 100nF cap right next to chip -->
  <rect x="370" y="290" width="22" height="10" fill="#a52" stroke="#fff"/>
  <text x="381" y="285" text-anchor="middle" class="silk" font-size="9">C1</text>

  <!-- Slide switch SS12D10 - top -->
  <rect x="260" y="170" width="80" height="36" fill="#444" stroke="#fff" stroke-width="1"/>
  <text x="300" y="190" text-anchor="middle" class="silk">SS12D10</text>
  <text x="300" y="202" text-anchor="middle" class="silk" font-size="9">S1 ON/OFF</text>
  <circle cx="275" cy="216" r="4" class="pad"/>
  <circle cx="300" cy="216" r="4" class="pad"/>
  <circle cx="325" cy="216" r="4" class="pad"/>

  <!-- Battery placeholder - bottom large area -->
  <rect x="160" y="380" width="280" height="100" fill="#3a3a3a" stroke="#fff" stroke-width="1" stroke-dasharray="6 4"/>
  <text x="300" y="410" text-anchor="middle" class="silk">BATTERY + CHARGER</text>
  <text x="300" y="425" text-anchor="middle" class="silk" font-size="9">PLACEHOLDER</text>
  <text x="300" y="440" text-anchor="middle" class="silk" font-size="9">2-pin header (BAT+, GND)</text>
  <text x="300" y="455" text-anchor="middle" class="silk" font-size="9">PCB house picks holder</text>
  <text x="300" y="470" text-anchor="middle" class="silk" font-size="9">+ TP4056 + protection</text>

  <!-- Output pads for battery placeholder -->
  <circle cx="200" cy="490" r="5" class="pad"/>
  <text x="200" y="508" text-anchor="middle" class="note">BAT+</text>
  <circle cx="400" cy="490" r="5" class="pad"/>
  <text x="400" y="508" text-anchor="middle" class="note">GND</text>

  <!-- Laser connector - right side -->
  <rect x="430" y="260" width="50" height="24" fill="#a00" stroke="#fff"/>
  <text x="455" y="276" text-anchor="middle" class="silk" font-size="10">LASER</text>
  <circle cx="442" cy="288" r="4" class="pad"/>
  <circle cx="468" cy="288" r="4" class="pad"/>
  <text x="442" y="302" text-anchor="middle" class="note" font-size="9">L+</text>
  <text x="468" y="302" text-anchor="middle" class="note" font-size="9">L−</text>

  <!-- Trigger connector - left side -->
  <rect x="120" y="260" width="50" height="24" fill="#00a" stroke="#fff"/>
  <text x="145" y="276" text-anchor="middle" class="silk" font-size="10">TRIG</text>
  <circle cx="132" cy="288" r="4" class="pad"/>
  <circle cx="158" cy="288" r="4" class="pad"/>
  <text x="132" y="302" text-anchor="middle" class="note" font-size="9">T1</text>
  <text x="158" y="302" text-anchor="middle" class="note" font-size="9">T2</text>

  <!-- ISP header - bottom right (optional 6-pin) -->
  <rect x="430" y="340" width="60" height="20" fill="#060" stroke="#fff" stroke-dasharray="3 2"/>
  <text x="460" y="354" text-anchor="middle" class="silk" font-size="10">ISP (opt)</text>
  <g>
    <circle cx="440" cy="372" r="3" class="pad"/>
    <circle cx="450" cy="372" r="3" class="pad"/>
    <circle cx="460" cy="372" r="3" class="pad"/>
    <circle cx="470" cy="372" r="3" class="pad"/>
    <circle cx="480" cy="372" r="3" class="pad"/>
    <circle cx="490" cy="372" r="3" class="pad"/>
  </g>

  <!-- DIMENSION 35mm -->
  <line x1="80" y1="320" x2="90" y2="320" class="dim"/>
  <line x1="510" y1="320" x2="520" y2="320" class="dim"/>
  <line x1="80" y1="315" x2="80" y2="325" class="dim"/>
  <line x1="520" y1="315" x2="520" y2="325" class="dim"/>
  <line x1="80" y1="320" x2="520" y2="320" class="dim" stroke-dasharray="6 4"/>
  <text x="300" y="335" text-anchor="middle" class="dim-lbl">35.0 mm</text>

  <!-- Vertical dimension -->
  <line x1="540" y1="110" x2="555" y2="110" class="dim"/>
  <line x1="540" y1="530" x2="555" y2="530" class="dim"/>
  <line x1="550" y1="110" x2="550" y2="530" class="dim" stroke-dasharray="6 4"/>
  <text x="565" y="320" class="dim-lbl">35.0 mm</text>

  <!-- Legend -->
  <rect x="20" y="540" width="560" height="50" fill="#fafafa" stroke="#888"/>
  <text x="30" y="558" font-weight="bold">PLACEMENT NOTES:</text>
  <text x="30" y="572" class="note">• ATtiny85 with DIP-8 socket in center. C1 (100nF) right next to pins 4+8.</text>
  <text x="30" y="585" class="note">• Slide switch above chip (accessible). Battery + charger placeholder below. Laser/Trig connectors on sides for easy wiring.</text>
</svg>
